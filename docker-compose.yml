services:
  postgres:
    image: postgres:16-alpine
    container_name: kleacore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kleacore
      POSTGRES_PASSWORD: kleacore123
      POSTGRES_DB: kleacore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kleacore -d kleacore"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    profiles: ["app"]
    image: node:20-alpine
    container_name: kleacore-app
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://kleacore:kleacore123@postgres:5432/kleacore
      AUTH_SECRET: change-me-in-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules: